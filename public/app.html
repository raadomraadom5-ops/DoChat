<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoChat App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="app-shell">
    <aside class="servers-panel">
      <div class="server-stack" id="serverList"></div>
      <div class="server-add">+</div>
    </aside>

    <aside class="channels-panel">
      <div class="panel-header">
        <h2>Community</h2>
        <button class="mini-button">⋯</button>
      </div>
      <div class="channel-search">Search channels</div>
      <div class="channel-list" id="channelList"></div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <span class="channel-pill">#</span>
          <h3 id="activeChannel">general</h3>
        </div>
        <div class="chat-header-actions">
          <button class="mini-button">Threads</button>
          <button class="mini-button">Invite</button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composerForm">
        <button type="button" class="mini-button plus">+</button>
        <input type="text" id="messageInput" placeholder="Message #general" />
        <button type="submit" class="primary-button small">Send</button>
      </form>
    </main>

    <aside class="members-panel">
      <div class="members-header">Members</div>
      <div class="member-list" id="memberList"></div>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
